name: Deploy stock dashboard (live data)

# SK하이닉스·삼성전자·마이크론·엔비디아 대시보드를 GitHub Pages로 배포한다.
# 매 실행마다 최신 시세를 서버(러너)에서 종목별 data.json으로 받아 함께 배포하므로,
# 폰 브라우저는 같은 출처(same-origin)에서 데이터를 읽어 CORS 문제가 없다.

on:
  push:
    branches: [ main ]
    paths:
      - 'stock-analyzer/**'
      - 'scripts/fetch_stock.sh'
      - 'scripts/fetch_news.sh'
      - '.github/workflows/deploy.yml'
  schedule:
    # KRX 정규장 09:00–15:30 KST = 00:00–06:30 UTC(평일). 30분 간격으로 갱신.
    # (스케줄 워크플로는 기본 브랜치(main)에서만 동작합니다.)
    - cron: '*/30 0-7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩만. 진행 중인 오래된 실행은 취소.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 미국 종목(Yahoo 간헐적 429)의 마지막 성공 시세를 캐시에서 복원.
      # 이번 수집이 실패해도 직전 실데이터가 남아 예시 폴백 대신 표시된다.
      - name: Restore cached US price data
        uses: actions/cache/restore@v4
        with:
          path: |
            stock-analyzer/micron/data.json
            stock-analyzer/nvidia/data.json
          key: us-price-${{ github.run_id }}
          restore-keys: |
            us-price-

      # ── 시세: 종목별로 수집 (한 종목이 실패해도 배포는 진행) ──
      - name: Fetch SK Hynix price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: '000660.KS'
          NUMCODE: '000660'
          NAME: 'SK하이닉스'
          RANGE: '1y'
          OUT: 'stock-analyzer/hynix/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch Samsung Electronics price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: '005930.KS'
          NUMCODE: '005930'
          NAME: '삼성전자'
          RANGE: '1y'
          OUT: 'stock-analyzer/samsung/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch Micron (US) price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: 'MU'
          NUMCODE: 'MU'
          NAME: '마이크론'
          MARKET: 'us'
          CURRENCY: 'USD'
          STOOQ_S: 'mu.us'
          SYMLABEL: 'MU'
          RANGE: '1y'
          OUT: 'stock-analyzer/micron/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch NVIDIA (US) price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: 'NVDA'
          NUMCODE: 'NVDA'
          NAME: '엔비디아'
          MARKET: 'us'
          CURRENCY: 'USD'
          STOOQ_S: 'nvda.us'
          SYMLABEL: 'NVDA'
          RANGE: '1y'
          OUT: 'stock-analyzer/nvidia/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      # ── 뉴스 심리(간이): Google News RSS + 키워드 규칙 (키 불필요) ──
      - name: Analyze SK Hynix news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: 'SK하이닉스'
          NEWS_QUERY: 'SK하이닉스'
          NEWS_OUT: 'stock-analyzer/hynix/news.json'

      - name: Analyze Samsung news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: '삼성전자'
          NEWS_QUERY: '삼성전자'
          NEWS_OUT: 'stock-analyzer/samsung/news.json'

      - name: Analyze Micron news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: '마이크론'
          NEWS_QUERY: '마이크론'
          NEWS_OUT: 'stock-analyzer/micron/news.json'

      - name: Analyze NVIDIA news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: '엔비디아'
          NEWS_QUERY: '엔비디아'
          NEWS_OUT: 'stock-analyzer/nvidia/news.json'

      # 이번 실행의 미국 시세(신규 성공분 또는 복원분)를 캐시에 저장 → 다음 실행에서 복원.
      - name: Save US price data to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            stock-analyzer/micron/data.json
            stock-analyzer/nvidia/data.json
          key: us-price-${{ github.run_id }}

      - name: Configure Pages
        # 최초 1회만 Settings → Pages → Source를 "GitHub Actions"로 설정해야 함
        # (워크플로 토큰은 Pages를 자동 생성할 권한이 없음).
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stock-analyzer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
