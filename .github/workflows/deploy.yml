name: Deploy stock dashboard (live data)

# SK하이닉스·삼성전자·마이크론·엔비디아 대시보드를 GitHub Pages로 배포한다.
# 매 실행마다 최신 시세를 서버(러너)에서 종목별 data.json으로 받아 함께 배포하므로,
# 폰 브라우저는 같은 출처(same-origin)에서 데이터를 읽어 CORS 문제가 없다.

on:
  push:
    branches: [ main ]
    paths:
      - 'stock-analyzer/**'
      - 'scripts/fetch_stock.sh'
      - 'scripts/fetch_news.sh'
      - 'scripts/fetch_fundamentals.sh'
      - 'scripts/fetch_financials.sh'
      - '.github/workflows/deploy.yml'
  schedule:
    # 시세·뉴스: 평일 10분 간격, 24시간 — 국내 장중(오전)과 미국 야간장(밤)을 모두 커버.
    - cron: '*/10 * * * 1-5'
    # PER·영업이익(분기 데이터): 평일 4시간 간격(:05분)으로만 갱신.
    #   FMP(250/일)·Alpha Vantage(25/일) 한도를 아끼고 DART 부하를 줄이기 위함.
    #   10분 실행에서는 아래 재무 스텝을 건너뛰고 캐시에 담긴 직전 값을 그대로 배포한다.
    # (스케줄 워크플로는 기본 브랜치(main)에서만 동작합니다.)
    - cron: '5 */4 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩만. 진행 중인 실행은 취소하지 않고 큐잉한다(cancel-in-progress: false).
# 국내 재무(6년 DART)로 full 빌드가 길어져, 10분 시세 스케줄이 push 빌드를
# 중간에 취소하던 문제 방지 — 진행 중 빌드는 끝까지 돌고 다음 실행이 뒤이어 실행.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 직전 성공 데이터를 캐시에서 복원한다.
      #  - 미국 시세(Yahoo 간헐적 429) 및 국내(KRX) 시세(네이버 간헐적 지연/차단)
      #    대비 마지막 성공분 — 소스 장애 시 직전 값으로 버텨 데이터가 사라지지 않게.
      #  - PER·영업이익(분기 데이터): 4시간마다만 갱신하므로 10분 실행에서는
      #    캐시에 담긴 직전 값을 복원해 그대로 배포한다(카드가 사라지지 않게).
      - name: Restore cached market data
        uses: actions/cache/restore@v4
        with:
          path: |
            stock-analyzer/hynix/data.json
            stock-analyzer/samsung/data.json
            stock-analyzer/kb/data.json
            stock-analyzer/nh/data.json
            stock-analyzer/micron/data.json
            stock-analyzer/nvidia/data.json
            stock-analyzer/tsmc/data.json
            stock-analyzer/amd/data.json
            stock-analyzer/wdc/data.json
            stock-analyzer/soxx/data.json
            stock-analyzer/usdkrw/data.json
            stock-analyzer/hynix/fundamentals.json
            stock-analyzer/samsung/fundamentals.json
            stock-analyzer/micron/fundamentals.json
            stock-analyzer/nvidia/fundamentals.json
            stock-analyzer/kb/fundamentals.json
            stock-analyzer/nh/fundamentals.json
            stock-analyzer/hynix/financials.json
            stock-analyzer/samsung/financials.json
            stock-analyzer/micron/financials.json
            stock-analyzer/nvidia/financials.json
            stock-analyzer/kb/financials.json
            stock-analyzer/nh/financials.json
          key: dash-cache-${{ github.run_id }}
          restore-keys: |
            dash-cache-

      # ── 시세: 종목별로 수집 (한 종목이 실패해도 배포는 진행) ──
      - name: Fetch SK Hynix price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: '000660.KS'
          NUMCODE: '000660'
          NAME: 'SK하이닉스'
          RANGE: '5y'
          OUT: 'stock-analyzer/hynix/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch Samsung Electronics price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: '005930.KS'
          NUMCODE: '005930'
          NAME: '삼성전자'
          RANGE: '5y'
          OUT: 'stock-analyzer/samsung/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch Micron (US) price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: 'MU'
          NUMCODE: 'MU'
          NAME: '마이크론'
          MARKET: 'us'
          CURRENCY: 'USD'
          STOOQ_S: 'mu.us'
          SYMLABEL: 'MU'
          RANGE: '5y'
          OUT: 'stock-analyzer/micron/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch NVIDIA (US) price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: 'NVDA'
          NUMCODE: 'NVDA'
          NAME: '엔비디아'
          MARKET: 'us'
          CURRENCY: 'USD'
          STOOQ_S: 'nvda.us'
          SYMLABEL: 'NVDA'
          RANGE: '5y'
          OUT: 'stock-analyzer/nvidia/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch KB Financial price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: '105560.KS'
          NUMCODE: '105560'
          NAME: 'KB금융'
          RANGE: '5y'
          OUT: 'stock-analyzer/kb/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch NH Investment price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: '005940.KS'
          NUMCODE: '005940'
          NAME: 'NH투자증권'
          RANGE: '5y'
          OUT: 'stock-analyzer/nh/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      # ── 예측 선행지표(가격만): US 반도체 바스켓 + 원/달러 환율. 실패해도 배포 진행.
      #    대시보드 예측 탭에서 있으면 특징으로 사용하고, 없으면 자동으로 건너뛴다. ──
      - name: Fetch TSMC price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: 'TSM'
          NUMCODE: 'TSM'
          NAME: 'TSMC'
          MARKET: 'us'
          CURRENCY: 'USD'
          STOOQ_S: 'tsm.us'
          SYMLABEL: 'TSM'
          RANGE: '5y'
          OUT: 'stock-analyzer/tsmc/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch AMD price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: 'AMD'
          NUMCODE: 'AMD'
          NAME: 'AMD'
          MARKET: 'us'
          CURRENCY: 'USD'
          STOOQ_S: 'amd.us'
          SYMLABEL: 'AMD'
          RANGE: '5y'
          OUT: 'stock-analyzer/amd/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch Western Digital price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: 'WDC'
          NUMCODE: 'WDC'
          NAME: 'Western Digital'
          MARKET: 'us'
          CURRENCY: 'USD'
          STOOQ_S: 'wdc.us'
          SYMLABEL: 'WDC'
          RANGE: '5y'
          OUT: 'stock-analyzer/wdc/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch SOXX (semiconductor index ETF) price data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: 'SOXX'
          NUMCODE: 'SOXX'
          NAME: 'SOX 반도체지수(ETF)'
          MARKET: 'us'
          CURRENCY: 'USD'
          STOOQ_S: 'soxx.us'
          SYMLABEL: 'SOXX'
          RANGE: '5y'
          OUT: 'stock-analyzer/soxx/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Fetch USD/KRW FX data
        continue-on-error: true
        run: bash scripts/fetch_stock.sh
        env:
          SYMBOL: 'KRW=X'
          # TwelveData FX는 'USD/KRW' 형식이어야 함(USDKRW는 404). Yahoo(KRW=X)가
          # 429일 때 대비해 재시도도 늘림. Stooq usdkrw는 데이터가 부실해 제외 셈.
          NUMCODE: 'USD/KRW'
          NAME: '원/달러 환율'
          MARKET: 'us'
          CURRENCY: 'KRW'
          STOOQ_S: 'usdkrw'
          SYMLABEL: 'USDKRW'
          RANGE: '5y'
          YAHOO_ATTEMPTS: '3'
          OUT: 'stock-analyzer/usdkrw/data.json'
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      # 가격 데이터만으로 예측 모델을 실행해 CI 로그와 실행 요약(Summary)에 남긴다.
      # 가격 수집 직후에 배치해, 뒤따르는 느린 영업이익(DART) 수집에 막히지 않게 한다.
      # (대시보드 예측 탭과 동일 로직 — 브라우저 대신 서버에서 실제 수치를 확인용으로 출력.)
      - name: 예측 리포트 (마이크론·엔비디아 → 하이닉스)
        if: always()
        run: |
          REPORT=$(python3 predict/predict_hynix_from_micron.py \
            --hynix stock-analyzer/hynix/data.json \
            --micron stock-analyzer/micron/data.json \
            --nvidia stock-analyzer/nvidia/data.json \
            --tsmc stock-analyzer/tsmc/data.json \
            --amd stock-analyzer/amd/data.json \
            --wdc stock-analyzer/wdc/data.json \
            --soxx stock-analyzer/soxx/data.json 2>&1) || true
          echo "$REPORT"
          {
            echo '## 마이크론·엔비디아 → 하이닉스 예측 (실데이터)'
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 뉴스 심리(간이): Google News RSS + 키워드 규칙 (키 불필요) ──
      - name: Analyze SK Hynix news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: 'SK하이닉스'
          NEWS_QUERY: 'SK하이닉스'
          NEWS_OUT: 'stock-analyzer/hynix/news.json'

      - name: Analyze Samsung news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: '삼성전자'
          NEWS_QUERY: '삼성전자'
          NEWS_OUT: 'stock-analyzer/samsung/news.json'

      - name: Analyze Micron news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: '마이크론'
          NEWS_QUERY: '마이크론'
          NEWS_OUT: 'stock-analyzer/micron/news.json'

      - name: Analyze NVIDIA news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: '엔비디아'
          NEWS_QUERY: '엔비디아'
          NEWS_OUT: 'stock-analyzer/nvidia/news.json'

      - name: Analyze KB Financial news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: 'KB금융'
          NEWS_QUERY: 'KB금융'
          NEWS_OUT: 'stock-analyzer/kb/news.json'

      - name: Analyze NH Investment news (keyword-based, no API key)
        continue-on-error: true
        run: bash scripts/fetch_news.sh
        env:
          NAME: 'NH투자증권'
          NEWS_QUERY: 'NH투자증권'
          NEWS_OUT: 'stock-analyzer/nh/news.json'

      # ── 재무지표(PER·영업이익): 분기 데이터라 자주 바뀌지 않고 미국 API 한도가
      #    빡빡하므로, 10분(시세) 실행에서는 건너뛰고 4시간 실행에서만 갱신한다.
      #    아래 8개 스텝은 '*/10 * * * 1-5' 크론이 아닐 때만(=4시간 크론·push·수동) 실행. ──
      - name: Fetch SK Hynix fundamentals (PER via Naver EPS)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_fundamentals.sh
        env:
          NAME: 'SK하이닉스'
          NUMCODE: '000660'
          MARKET: 'krx'
          CURRENCY: 'KRW'
          CORP_CODE: '00164779'
          OUT: 'stock-analyzer/hynix/fundamentals.json'
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Fetch Samsung fundamentals (PER via Naver EPS)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_fundamentals.sh
        env:
          NAME: '삼성전자'
          NUMCODE: '005930'
          MARKET: 'krx'
          CURRENCY: 'KRW'
          CORP_CODE: '00126380'
          OUT: 'stock-analyzer/samsung/fundamentals.json'
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Fetch Micron fundamentals (PER via EPS)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_fundamentals.sh
        env:
          NAME: '마이크론'
          SYMBOL: 'MU'
          MARKET: 'us'
          CURRENCY: 'USD'
          OUT: 'stock-analyzer/micron/fundamentals.json'
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      - name: Fetch NVIDIA fundamentals (PER via EPS)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_fundamentals.sh
        env:
          NAME: '엔비디아'
          SYMBOL: 'NVDA'
          MARKET: 'us'
          CURRENCY: 'USD'
          OUT: 'stock-analyzer/nvidia/fundamentals.json'
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      - name: Fetch KB Financial fundamentals (PER via Naver EPS)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_fundamentals.sh
        env:
          NAME: 'KB금융'
          NUMCODE: '105560'
          MARKET: 'krx'
          CURRENCY: 'KRW'
          OUT: 'stock-analyzer/kb/fundamentals.json'
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Fetch NH Investment fundamentals (PER via Naver EPS)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_fundamentals.sh
        env:
          NAME: 'NH투자증권'
          NUMCODE: '005940'
          MARKET: 'krx'
          CURRENCY: 'KRW'
          OUT: 'stock-analyzer/nh/fundamentals.json'
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      # ── 영업이익(분기): 국내는 DART, 미국은 FMP·Alpha Vantage. (4시간 실행에서만) ──
      - name: Fetch SK Hynix operating income (DART)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_financials.sh
        env:
          NAME: 'SK하이닉스'
          MARKET: 'krx'
          CURRENCY: 'KRW'
          CORP_CODE: '00164779'
          OUT: 'stock-analyzer/hynix/financials.json'
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Fetch Samsung operating income (DART)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_financials.sh
        env:
          NAME: '삼성전자'
          MARKET: 'krx'
          CURRENCY: 'KRW'
          CORP_CODE: '00126380'
          OUT: 'stock-analyzer/samsung/financials.json'
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Fetch Micron operating income (FMP → Alpha Vantage)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_financials.sh
        env:
          NAME: '마이크론'
          SYMBOL: 'MU'
          MARKET: 'us'
          CURRENCY: 'USD'
          OUT: 'stock-analyzer/micron/financials.json'
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      - name: Fetch NVIDIA operating income (FMP → Alpha Vantage)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_financials.sh
        env:
          NAME: '엔비디아'
          SYMBOL: 'NVDA'
          MARKET: 'us'
          CURRENCY: 'USD'
          OUT: 'stock-analyzer/nvidia/financials.json'
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}

      - name: Fetch KB Financial operating income (DART)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_financials.sh
        env:
          NAME: 'KB금융'
          NUMCODE: '105560'
          MARKET: 'krx'
          CURRENCY: 'KRW'
          OUT: 'stock-analyzer/kb/financials.json'
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Fetch NH Investment operating income (DART)
        if: ${{ github.event.schedule != '*/10 * * * 1-5' }}
        continue-on-error: true
        run: bash scripts/fetch_financials.sh
        env:
          NAME: 'NH투자증권'
          NUMCODE: '005940'
          MARKET: 'krx'
          CURRENCY: 'KRW'
          OUT: 'stock-analyzer/nh/financials.json'
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      # 이번 실행의 데이터(신규 성공분 또는 복원분)를 캐시에 저장 → 다음 실행에서 복원.
      # PER·영업이익은 4시간 실행에서 갱신되고, 그 사이 10분 실행들은 이 캐시로 유지된다.
      - name: Save market data to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            stock-analyzer/hynix/data.json
            stock-analyzer/samsung/data.json
            stock-analyzer/kb/data.json
            stock-analyzer/nh/data.json
            stock-analyzer/micron/data.json
            stock-analyzer/nvidia/data.json
            stock-analyzer/tsmc/data.json
            stock-analyzer/amd/data.json
            stock-analyzer/wdc/data.json
            stock-analyzer/soxx/data.json
            stock-analyzer/usdkrw/data.json
            stock-analyzer/hynix/fundamentals.json
            stock-analyzer/samsung/fundamentals.json
            stock-analyzer/micron/fundamentals.json
            stock-analyzer/nvidia/fundamentals.json
            stock-analyzer/kb/fundamentals.json
            stock-analyzer/nh/fundamentals.json
            stock-analyzer/hynix/financials.json
            stock-analyzer/samsung/financials.json
            stock-analyzer/micron/financials.json
            stock-analyzer/nvidia/financials.json
            stock-analyzer/kb/financials.json
            stock-analyzer/nh/financials.json
          key: dash-cache-${{ github.run_id }}

      - name: Configure Pages
        # 최초 1회만 Settings → Pages → Source를 "GitHub Actions"로 설정해야 함
        # (워크플로 토큰은 Pages를 자동 생성할 권한이 없음).
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stock-analyzer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
